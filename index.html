<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Timer Belajar</title>
<style>
:root{--bg1:#fdf3e3;--bg2:#ffd9b0;--text:#2b2118;--muted:#7a6a5a;--accent:#f4733a;--track:rgba(43,33,24,.13);--btn:rgba(255,255,255,.78);--on:#fff;--W:320px;--H:460px;--ring:166px;--fs:45px;--zfs:96px}
:root[data-theme="dark"]{--bg1:#0b1020;--bg2:#1b1f4a;--text:#eef0ff;--muted:#9aa0c8;--accent:#8b8cff;--track:rgba(255,255,255,.12);--btn:rgba(255,255,255,.1)}
:root[data-theme="laut"]{--bg1:#e0f4ff;--bg2:#7fd1f0;--text:#0b2b3d;--muted:#4d7388;--accent:#0a8fd6;--track:rgba(11,43,61,.12)}
:root[data-theme="hutan"]{--bg1:#07160f;--bg2:#12402a;--text:#e6f6ec;--muted:#8fb9a0;--accent:#4ade80;--track:rgba(255,255,255,.12);--btn:rgba(255,255,255,.1);--on:#052e16}
:root[data-theme="sakura"]{--bg1:#fff0f5;--bg2:#ffc2d9;--text:#3b1624;--muted:#86596b;--accent:#e5457f;--track:rgba(59,22,36,.12)}
:root[data-theme="senja"]{--bg1:#2d1b4e;--bg2:#e8704a;--text:#fff5ec;--muted:#f2cdb8;--accent:#ffd166;--track:rgba(255,255,255,.2);--btn:rgba(255,255,255,.16);--on:#3a1d00}
:root[data-theme="kopi"]{--bg1:#f3e9dc;--bg2:#c9a27e;--text:#3e2a1c;--muted:#7d6350;--accent:#8a5230;--track:rgba(62,42,28,.13)}
:root[data-theme="neon"]{--bg1:#05050a;--bg2:#14052b;--text:#f5f5ff;--muted:#a29bd1;--accent:#00f0ff;--track:rgba(0,240,255,.14);--btn:rgba(255,255,255,.08);--on:#001418}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg1)}
body{font-family:-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;color:var(--text)}
button{font-family:inherit;color:var(--text);border:0;background:var(--btn);cursor:pointer;padding:0}
button:active{opacity:.7}
#app{position:fixed;top:0;left:0;width:var(--W);height:var(--H);display:flex;flex-direction:column;padding:10px 14px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden;transform-origin:0 0;transition:background .5s}
#app.rot{transform:rotate(90deg) translateY(-100%)}
#bg{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;display:none;pointer-events:none}
.hasbg #bg{display:block}
#bg::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg1);opacity:.4}
#bg i{position:absolute;display:block;font-style:normal}
header,#stage,#side{position:relative;z-index:2}
header{display:flex;align-items:center;justify-content:space-between;height:40px;flex:none}
.ttl{font-size:1rem;font-weight:700}
.ic button{width:38px;height:38px;border-radius:50%;margin-left:8px;display:inline-flex;align-items:center;justify-content:center}
.ic svg{width:19px;height:19px}
.ic svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.ring{position:relative;width:var(--ring);height:var(--ring)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.t{stroke:var(--track)}
.p{stroke:var(--accent);stroke-dasharray:565.48;transition:stroke-dashoffset .3s linear,stroke .5s}
.done .p{stroke:#2fbf71}
.time{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.time b{font-size:var(--fs);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.time span{font-size:.72rem;color:var(--muted);margin-top:6px}
#side{flex:none}
.adj{display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.adj button{width:48px;height:48px;border-radius:50%;font-size:1.6rem}
.m{width:96px;text-align:center}
.m b{font-size:1.5rem}
.m small{display:block;font-size:.7rem;color:var(--muted)}
.presets{display:flex;justify-content:center;margin-bottom:12px}
.presets button{width:54px;padding:7px 0;border-radius:999px;font-size:.8rem;font-weight:600;margin:0 4px}
.main{display:flex}
.main button{height:52px;border-radius:16px;font-size:1rem;font-weight:700}
#go{flex:1;background:var(--accent);color:var(--on)}
#rs{width:84px;margin-left:10px}
#app.land{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;padding:4px 16px 8px}
.land header{grid-column:1/3;height:36px}
.land #stage{grid-column:1;grid-row:2;margin-right:22px}
.land #side{grid-column:2;grid-row:2;align-self:center}
.land .adj{margin-bottom:8px}
.land .adj button{width:42px;height:42px}
.land .presets{margin-bottom:10px}
.land .main button{height:44px}
.zoom .ring{width:100%;height:auto}
.zoom .ring svg,.zoom .adj,.zoom .presets{display:none}
.zoom .time{position:static}
.zoom .time b{font-size:var(--zfs)}
.zoom .time span{font-size:.9rem}
#app.land.zoom{grid-template-rows:auto 1fr auto}
.land.zoom #stage{grid-column:1/3;margin:0}
.land.zoom #side{grid-column:1/3;grid-row:3}
#veil{position:absolute;top:0;left:0;right:0;bottom:0;z-index:25;display:none}
#veil.on{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--bg1);border-radius:22px 22px 0 0;padding:14px 14px 8px;max-height:82%;overflow:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .3s;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
#sheet.on{transform:none}
#sheet h4{margin:0 0 8px;font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sw{display:flex;flex-wrap:wrap;margin-bottom:6px}
.sw button{width:32px;height:32px;border-radius:50%;margin:0 8px 8px 0;border:2px solid transparent}
.sw button.on{border-color:var(--text)}
.chips{display:flex;flex-wrap:wrap}
.chips button{padding:8px 10px;border-radius:14px;font-size:.8rem;font-weight:600;margin:0 6px 6px 0}
.chips button.on{outline:2px solid var(--accent)}
#toast{position:absolute;left:14px;right:14px;bottom:76px;z-index:40;padding:10px 14px;border-radius:14px;background:var(--text);color:var(--bg1);font-size:.76rem;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
@keyframes fl{from{transform:translateX(calc(var(--W) + 40px))}to{transform:translateX(-80px)}}
@keyframes drift{from{transform:translateX(-170px)}to{transform:translateX(calc(var(--W) + 20px))}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes tw{50%{opacity:.15}}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(calc(var(--H) * -1.1));opacity:0}}
@keyframes fall{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(calc(var(--H) + 40px)) rotate(360deg)}}
@keyframes rain{from{transform:translateY(-30px)}to{transform:translateY(calc(var(--H) + 30px))}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes shoot{0%{transform:translate(0,0) rotate(-35deg);opacity:1}12%{transform:translate(calc(var(--W) * -.6),calc(var(--H) * .4)) rotate(-35deg);opacity:0}100%{transform:translate(calc(var(--W) * -.6),calc(var(--H) * .4)) rotate(-35deg);opacity:0}}
@media (prefers-reduced-motion:reduce){#bg *{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <header>
    <b class="ttl">📚 Fokus</b>
    <div class="ic"><button id="zoom" aria-label="Perbesar angka"></button><button id="rot" aria-label="Putar horizontal"></button><button id="pal" aria-label="Tema dan latar"></button></div>
  </header>
  <section id="stage">
    <div class="ring">
      <svg viewBox="0 0 200 200"><circle class="t" cx="100" cy="100" r="90"/><circle class="p" id="ring" cx="100" cy="100" r="90"/></svg>
      <div class="time" id="timeBox"><b id="disp">25:00</b><span id="status">Siap belajar</span></div>
    </div>
  </section>
  <section id="side">
    <div class="adj"><button id="minus" aria-label="Kurangi 1 menit">−</button><div class="m"><b id="mins">25</b><small>menit</small></div><button id="plus" aria-label="Tambah 1 menit">+</button></div>
    <div class="presets"><button data-m="15">15</button><button data-m="25">25</button><button data-m="45">45</button><button data-m="60">60</button></div>
    <div class="main"><button id="go">Mulai</button><button id="rs">Reset</button></div>
  </section>
  <div id="veil"></div>
  <div id="sheet"><h4>Tema</h4><div class="sw" id="sw"></div><h4>Latar animasi</h4><div class="chips" id="chips"></div></div>
  <div id="toast"></div>
</div>
<script>
(function(){
var MIN=1,MAX=180,C=565.48,total=1500,remaining=1500,running=false,endAt=0,timer=null,rot=false;
var $=function(i){return document.getElementById(i)};
var app=$('app'),disp=$('disp'),ring=$('ring'),status=$('status'),mins=$('mins'),go=$('go'),root=document.documentElement;
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ic(p){return '<svg viewBox="0 0 24 24">'+p+'</svg>'}
$('zoom').innerHTML=ic('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/>');
$('rot').innerHTML=ic('<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>');
$('pal').innerHTML=ic('<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>');

/* ukuran khusus layar kecil (iPhone 5s): semua dihitung dari px nyata */
function fit(){
  var iw=window.innerWidth,ih=window.innerHeight,real=iw>ih;
  if(real&&rot)rot=false;
  var W=rot?ih:iw,H=rot?iw:ih,land=rot||real,st=app.style;
  st.width=W+'px';st.height=H+'px';
  st.setProperty('--W',W+'px');st.setProperty('--H',H+'px');
  var r=land?Math.min(H*.62,W*.4):Math.min(W*.74,H*.36);
  st.setProperty('--ring',Math.round(r)+'px');
  st.setProperty('--fs',Math.round(r*.27)+'px');
  st.setProperty('--zfs',Math.round(Math.min(W*.3,H*(land?.5:.4)))+'px');
  app.classList.toggle('rot',rot);app.classList.toggle('land',land);
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',function(){setTimeout(fit,300)});

var toast=$('toast'),tt=null;
function say(m){toast.textContent=m;toast.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toast.style.opacity=0},3800)}
$('rot').onclick=function(){rot=!rot;fit();if(rot)say('Putar HP berlawanan arah jarum jam. Ketuk lagi untuk kembali.')};
$('zoom').onclick=$('timeBox').onclick=function(){app.classList.toggle('zoom')};

/* tema */
var TH=[['light','linear-gradient(135deg,#fdf3e3,#f4733a)'],['dark','linear-gradient(135deg,#0b1020,#8b8cff)'],['laut','linear-gradient(135deg,#e0f4ff,#0a8fd6)'],['hutan','linear-gradient(135deg,#07160f,#4ade80)'],['sakura','linear-gradient(135deg,#fff0f5,#e5457f)'],['senja','linear-gradient(135deg,#2d1b4e,#e8704a)'],['kopi','linear-gradient(135deg,#f3e9dc,#8a5230)'],['neon','linear-gradient(135deg,#05050a,#00f0ff)']];
var sw=$('sw');
function setTheme(t){
  root.setAttribute('data-theme',t);
  Array.prototype.forEach.call(sw.children,function(b){b.classList.toggle('on',b.dataset.t===t)});
  save('tb-theme',t);
}
TH.forEach(function(x){var b=document.createElement('button');b.dataset.t=x[0];b.style.background=x[1];b.setAttribute('aria-label','Tema '+x[0]);b.onclick=function(){setTheme(x[0])};sw.appendChild(b)});
var sv=load('tb-theme');
if(!TH.some(function(x){return x[0]===sv})){var hr=new Date().getHours();sv=hr>=6&&hr<18?'light':'dark'}
setTheme(sv);

/* latar animasi */
function R(a,b){return a+Math.random()*(b-a)}
function E(s,c){return '<i style="'+s+'">'+(c||'')+'</i>'}
function M(c,d,h){return '<svg viewBox="0 0 400 100" preserveAspectRatio="none" style="position:absolute;left:0;bottom:0;width:100%;height:'+h+'%"><path fill="'+c+'" d="'+d+'"/></svg>'}
function T(c,b,h){var d='',x;for(x=0;x<400;x+=24)d+='M'+x+' 100L'+(x+12)+' '+Math.round(R(b,b+22))+'L'+(x+24)+' 100Z';return M(c,d,h)}
function Wv(bt,h,c,s){return '<svg viewBox="0 0 800 60" preserveAspectRatio="none" style="position:absolute;left:0;bottom:'+bt+'%;width:200%;height:'+h+'%;animation:wave '+s+'s linear infinite"><path fill="'+c+'" d="M0 30Q50 0 100 30T200 30T300 30T400 30T500 30T600 30T700 30T800 30V60H0Z"/></svg>'}
function Cl(n,a,b,o){var s='',i;for(i=0;i<n;i++)s+=E('top:'+R(a,b)+'%;left:0;width:'+R(90,150)+'px;height:'+R(26,40)+'px;border-radius:40px;background:rgba(255,255,255,'+o+');animation:drift '+R(45,80)+'s '+(-R(0,60))+'s linear infinite');return s}
function Fl(n,a,b,em,sz,w){var s='',i;for(i=0;i<n;i++)s+=E('top:'+R(a,b)+'%;left:0;font-size:'+R(sz,sz+10)+'px;animation:fl '+R(16,28)+'s '+(-R(0,20))+'s linear infinite','<b style="display:inline-block;animation:bob '+R(.8,1.4)+'s ease-in-out infinite">'+(w?em[i%em.length]:em)+'</b>');return s}
var B={
hutan:['linear-gradient(#0d2b1d,#14532d)',function(){var s=T('#166534',38,34)+T('#0b3d24',50,26)+T('#04180e',62,18),i;for(i=0;i<14;i++)s+=E('left:'+R(3,95)+'%;top:'+R(25,85)+'%;width:6px;height:6px;border-radius:50%;background:#fde68a;box-shadow:0 0 10px #fde68a;animation:tw '+R(2,4)+'s '+(-R(0,4))+'s infinite,bob '+R(4,7)+'s '+(-R(0,5))+'s infinite');return s}],
gunung:['linear-gradient(#ffd89b,#f6a5c0 60%,#9b8fd1)',function(){return E('right:16%;top:14%;width:64px;height:64px;border-radius:50%;background:#fff3c4;box-shadow:0 0 60px #ffe08a')+Cl(4,8,40,.7)+M('#7c6fb0','M0 100L60 40L110 80L170 25L240 85L300 45L360 78L400 55V100Z',50)+M('#4b3f82','M0 100L40 70L100 50L170 85L250 55L330 80L400 60V100Z',32)}],
laut:['linear-gradient(#8fe3ff,#0a6fb3 65%,#054a7a)',function(){var s=Fl(5,40,85,['🐟','🐠'],18,1),i,r;for(i=0;i<10;i++){r=R(4,12);s+=E('left:'+R(2,96)+'%;bottom:-5%;width:'+r+'px;height:'+r+'px;border-radius:50%;border:1px solid rgba(255,255,255,.6);animation:rise '+R(6,12)+'s '+(-R(0,10))+'s linear infinite')}return s+Wv(6,14,'rgba(255,255,255,.22)',8)+Wv(0,14,'rgba(255,255,255,.3)',5)}],
bintang:['linear-gradient(#02010a,#1b1464)',function(){var s=E('right:12%;top:10%;width:42px;height:42px;border-radius:50%;background:#fff7d6;box-shadow:0 0 40px #fff7d6'),i,z;for(i=0;i<36;i++){z=R(1.5,3.5);s+=E('left:'+R(1,98)+'%;top:'+R(1,95)+'%;width:'+z+'px;height:'+z+'px;border-radius:50%;background:#fff;animation:tw '+R(1.5,4)+'s '+(-R(0,4))+'s infinite')}return s+E('right:10%;top:8%;width:90px;height:2px;background:linear-gradient(270deg,transparent,#fff);animation:shoot 7s 2s infinite')}],
burung:['linear-gradient(#7ec8ff,#d6f0ff)',function(){return Cl(5,5,45,.8)+Fl(5,8,50,'🐦',18)+M('#4ade80','M0 100L0 70Q100 40 200 65T400 60V100Z',22)}],
kebun:['linear-gradient(#ffeef4,#d8f3dc)',function(){var s='',i;for(i=0;i<12;i++)s+=E('left:'+R(0,95)+'%;top:0;font-size:'+R(14,26)+'px;animation:fall '+R(9,17)+'s '+(-R(0,15))+'s linear infinite','🌸');return s+Fl(4,20,70,'🦋',16)+E('left:0;right:0;bottom:2%;text-align:center;font-size:24px;letter-spacing:5px','🌷🌼🌻🌷🌼🌻🌷')}],
hujan:['linear-gradient(#4b5563,#1f2937)',function(){var s=Cl(4,0,15,.2),i;for(i=0;i<36;i++)s+=E('left:'+R(0,100)+'%;top:0;width:2px;height:16px;background:linear-gradient(transparent,rgba(180,210,255,.8));animation:rain '+R(.7,1.3)+'s '+(-R(0,1.3))+'s linear infinite');return s}]
};
var SC=[['none','🎨 Tema'],['hutan','🌲 Hutan'],['gunung','⛰️ Gunung'],['laut','🌊 Laut'],['bintang','🌌 Bintang'],['burung','🐦 Burung'],['kebun','🦋 Kebun'],['hujan','🌧️ Hujan']];
var chips=$('chips'),bg=$('bg');
function setBg(k){
  if(!B[k]){k='none';bg.innerHTML='';bg.style.background='';app.classList.remove('hasbg')}
  else{bg.style.background=B[k][0];bg.innerHTML=B[k][1]();app.classList.add('hasbg')}
  Array.prototype.forEach.call(chips.children,function(b){b.classList.toggle('on',b.dataset.k===k)});
  save('tb-bg',k);
}
SC.forEach(function(x){var b=document.createElement('button');b.dataset.k=x[0];b.textContent=x[1];b.onclick=function(){setBg(x[0])};chips.appendChild(b)});
function sheet(on){$('sheet').classList.toggle('on',on);$('veil').classList.toggle('on',on)}
$('pal').onclick=function(){sheet(true)};
$('veil').onclick=function(){sheet(false)};

/* timer */
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function render(){
  disp.textContent=fmt(remaining);
  mins.textContent=Math.round(total/60);
  ring.style.strokeDashoffset=C*(1-(total?remaining/total:0));
  document.title=(running?fmt(remaining)+' · ':'')+'Timer Belajar';
}
function adjust(d){
  var nt=total+d*60;
  if(nt<MIN*60||nt>MAX*60)return;
  if(running){if(remaining+d*60<=0)return;endAt+=d*60000;total=nt;remaining+=d*60}
  else{total=remaining=nt;app.classList.remove('done');status.textContent='Siap belajar'}
  save('tb-min',Math.round(total/60));render();
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
}
var AC=null;
function unlock(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume()}catch(e){}}
function beep(){
  try{unlock();var ac=AC;[0,.3,.6].forEach(function(t){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.2,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.25);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.25)})}catch(e){}
  if(navigator.vibrate)try{navigator.vibrate([200,100,200,100,400])}catch(e){}
}
function tick(){remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));render();if(remaining<=0)finish()}
function start(){unlock();if(remaining<=0)remaining=total;endAt=Date.now()+remaining*1000;running=true;app.classList.remove('done');go.textContent='Jeda';status.textContent='Fokus…';clearInterval(timer);timer=setInterval(tick,250)}
function pause(){running=false;clearInterval(timer);go.textContent='Lanjut';status.textContent='Dijeda';render()}
function finish(){running=false;clearInterval(timer);go.textContent='Mulai';status.textContent='Selesai! Istirahat 🎉';app.classList.add('done');beep();render()}
function reset(){running=false;clearInterval(timer);remaining=total;app.classList.remove('done');go.textContent='Mulai';status.textContent='Siap belajar';render()}
go.onclick=function(){running?pause():start()};
$('rs').onclick=reset;
$('plus').onclick=function(){adjust(1)};
$('minus').onclick=function(){adjust(-1)};
Array.prototype.forEach.call(document.querySelectorAll('.presets button'),function(b){b.onclick=function(){if(running)return;total=remaining=parseInt(b.dataset.m,10)*60;save('tb-min',b.dataset.m);app.classList.remove('done');status.textContent='Siap belajar';render()}});
window.addEventListener('keydown',function(e){
  var k=e.key,c=e.code;
  if(k==='AudioVolumeUp'||c==='AudioVolumeUp'||k==='VolumeUp'||e.keyCode===175||k==='ArrowUp'){e.preventDefault();adjust(1)}
  else if(k==='AudioVolumeDown'||c==='AudioVolumeDown'||k==='VolumeDown'||e.keyCode===174||k==='ArrowDown'){e.preventDefault();adjust(-1)}
},true);
