<style>

:root[data-theme="dark"]{--bg1:#0b1020;--bg2:#1b1f4a;--card:rgba(255,255,255,.07);--text:#eef0ff;--muted:#9aa0c8;--accent:#8b8cff;--track:rgba(255,255,255,.1);--btn:rgba(255,255,255,.08);--shadow:0 20px 60px rgba(0,0,0,.5)}
:root[data-theme="laut"]{--bg1:#e0f4ff;--bg2:#7fd1f0;--card:rgba(255,255,255,.55);--text:#0b2b3d;--muted:#4d7388;--accent:#0a8fd6;--track:rgba(11,43,61,.1);--btn:#fff;--shadow:0 20px 60px rgba(10,143,214,.3)}
:root[data-theme="hutan"]{--bg1:#07160f;--bg2:#12402a;--card:rgba(255,255,255,.07);--text:#e6f6ec;--muted:#8fb9a0;--accent:#4ade80;--track:rgba(255,255,255,.1);--btn:rgba(255,255,255,.08);--shadow:0 20px 60px rgba(0,0,0,.5);--on:#052e16}
:root[data-theme="sakura"]{--bg1:#fff0f5;--bg2:#ffc2d9;--card:rgba(255,255,255,.6);--text:#3b1624;--muted:#86596b;--accent:#e5457f;--track:rgba(59,22,36,.1);--btn:#fff;--shadow:0 20px 60px rgba(229,69,127,.25)}
:root[data-theme="senja"]{--bg1:#2d1b4e;--bg2:#e8704a;--card:rgba(255,255,255,.12);--text:#fff5ec;--muted:#f2cdb8;--accent:#ffd166;--track:rgba(255,255,255,.18);--btn:rgba(255,255,255,.15);--shadow:0 20px 60px rgba(0,0,0,.35);--on:#3a1d00}
:root[data-theme="kopi"]{--bg1:#f3e9dc;--bg2:#c9a27e;--card:rgba(255,255,255,.5);--text:#3e2a1c;--muted:#7d6350;--accent:#8a5230;--track:rgba(62,42,28,.12);--btn:rgba(255,255,255,.7);--shadow:0 20px 60px rgba(138,82,48,.3)}
:root[data-theme="neon"]{--bg1:#05050a;--bg2:#14052b;--card:rgba(255,255,255,.05);--text:#f5f5ff;--muted:#a29bd1;--accent:#00f0ff;--track:rgba(0,240,255,.12);--btn:rgba(255,255,255,.07);--shadow:0 0 60px rgba(0,240,255,.25);--on:#001418}
body{overflow-y:auto}
.app{position:relative}
.app.rot{position:fixed;top:0;left:0;margin:0;border-radius:0;overflow:auto;transform-origin:0 0;transform:rotate(90deg) translateY(-100%);display:grid;grid-template-columns:auto 1fr;grid-template-areas:"h s" "r a" "r p" "r m" "n n";column-gap:24px;align-items:center;padding:12px 20px;box-shadow:none}
.app.rot header{margin-bottom:0;grid-area:h}
.app.rot .ht,.app.rot .hint{display:none}
.app.rot .sw{margin:0;grid-area:s;justify-content:flex-end}
.app.rot .sw button{width:24px;height:24px}
.app.rot .ring{grid-area:r;width:min(200px,52vw);height:min(200px,52vw);margin:0}
.app.rot .time b{font-size:min(2.6rem,8vw)}
.app.rot .adj{grid-area:a;margin:0 0 8px}
.app.rot .adj button{width:44px;height:44px}
.app.rot .presets{grid-area:p;margin-bottom:10px}
.app.rot .main{grid-area:m}
.app.rot .main button{padding:12px}
.app.full{width:100%;max-width:none;min-height:100%;border-radius:0;box-shadow:none}
.toast{position:absolute;left:12px;right:12px;bottom:10px;padding:10px 14px;border-radius:14px;background:var(--text);color:var(--bg1);font-size:.78rem;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
@keyframes fl{from{transform:translateX(120vw)}to{transform:translateX(-25vw)}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes tw{50%{opacity:.15}}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-110vh);opacity:0}}
@keyframes fall{from{transform:translateY(-8vh) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}
@keyframes rain{from{transform:translateY(-10vh)}to{transform:translateY(110vh)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes shoot{0%{transform:translate(0,0) rotate(-35deg);opacity:1}12%{transform:translate(-60vw,42vh) rotate(-35deg);opacity:0}100%{transform:translate(-60vw,42vh) rotate(-35deg);opacity:0}}
#bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;overflow:hidden;display:none;pointer-events:none}
.hasbg #bg{display:block}
#bg i{position:absolute;font-style:normal;display:block}
.hasbg .app{isolation:isolate}
.hasbg .app::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;background:var(--bg1);opacity:.82;z-index:-1}
.panel{position:absolute;top:60px;left:10px;right:10px;padding:8px;border-radius:20px;background:var(--bg1);box-shadow:0 12px 40px rgba(0,0,0,.35);display:none;flex-wrap:wrap;justify-content:center;z-index:20}
.panel.on{display:flex}
.panel button{border:0;background:var(--btn);color:var(--text);border-radius:14px;padding:8px 10px;margin:3px;font-size:.8rem;font-weight:600;cursor:pointer}
.panel button.on{outline:2px solid var(--accent)}
@media (prefers-reduced-motion:reduce){#bg *{animation:none!important}}
.time{cursor:pointer}
.app.zoom{display:block}
.app.zoom .ring{width:auto;height:auto;margin:10px 0}
.app.zoom .ring svg{display:none}
.app.zoom .time{position:static}
.app.zoom .time b{font-size:min(27vw,42vh);line-height:1.05}
.app.zoom .time span{font-size:1rem;margin-top:6px}
.app.zoom .adj,.app.zoom .presets,.app.zoom .hint,.app.zoom .sw{display:none}
.app{margin:auto}
.sw{display:flex;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.sw button{margin:3px 5px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .2s}
.sw button.on{border-color:var(--text);transform:scale(1.15)}
@media (max-width:360px){
.app{width:94vw;padding:16px 14px;border-radius:24px}
h1{font-size:.95rem}
.ht{display:none}
.theme+.theme{margin-left:6px}
.theme{width:38px;height:38px;font-size:1.05rem}
.sw button{width:26px;height:26px;margin:2px 4px}
.adj{margin:4px 0 10px}
.adj button{width:46px;height:46px}
.presets{margin-bottom:12px}
.presets button{padding:7px 12px}
.main button{padding:14px}
.hint{font-size:.7rem;margin-top:12px}
}
@media (orientation:portrait) and (max-height:540px){.hint{display:none}}
@media (orientation:landscape) and (max-height:560px){
.app{width:min(94vw,760px);padding:16px 22px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"h s" "r a" "r p" "r m" "n n";column-gap:28px;align-items:center;border-radius:28px}
header{grid-area:h;margin-bottom:0}
.ht{display:none}
.sw{grid-area:s;justify-content:flex-end;margin:0}
.ring{grid-area:r;width:min(200px,52vh);height:min(200px,52vh);margin:0}
.time b{font-size:2.6rem}
.adj{grid-area:a;margin:0 0 10px}
.presets{grid-area:p;margin-bottom:12px}
.main{grid-area:m}
.hint{grid-area:n;margin:10px 0 0}
}
@media (orientation:landscape) and (max-height:360px){
.hint{display:none}
.app{padding:12px 20px}
.sw button{width:24px;height:24px}
.adj button{width:44px;height:44px}
.main button{padding:12px}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg1);color:var(--text);display:flex;align-items:center;justify-content:center;transition:background .5s,color .5s}
.app{width:min(92vw,400px);padding:24px;border-radius:32px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);text-align:center}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:1.05rem;margin:0;font-weight:600;letter-spacing:.3px}
.theme{border:0;background:var(--btn);color:var(--text);width:42px;height:42px;border-radius:50%;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.theme+.theme{margin-left:8px}
.theme svg{width:20px;height:20px;transform:none}
.theme svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ring{position:relative;width:min(240px,64vw,34vh);height:min(240px,64vw,34vh);margin:12px auto}
svg{width:100%;height:100%;transform:rotate(-90deg)}
circle{fill:none;stroke-width:12;stroke-linecap:round}
.t{stroke:var(--track)}
.p{stroke:var(--accent);stroke-dasharray:565.48;stroke-dashoffset:0;transition:stroke-dashoffset .3s linear,stroke .5s}
.time{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time b{font-size:min(3.2rem,9.5vh);font-variant-numeric:tabular-nums;font-weight:700}
.time span{color:var(--muted);font-size:.85rem;margin-top:2px}
.adj{display:flex;justify-content:center;align-items:center;margin:6px 0 14px}
.adj>*{margin:0 7px}
.adj button,.presets button{border:0;background:var(--btn);color:var(--text);cursor:pointer;font-weight:600}
.adj button{width:52px;height:52px;border-radius:50%;font-size:1.5rem}
.adj .m{min-width:90px;font-size:1.1rem}
.presets{display:flex;justify-content:center;margin-bottom:16px}
.presets button{margin:0 4px}
.presets button{padding:8px 14px;border-radius:999px;font-size:.85rem}
.main{display:flex}
.main button+button{margin-left:10px}
.main button{flex:1;padding:16px;border:0;border-radius:18px;font-size:1rem;font-weight:700;cursor:pointer}
#go{background:var(--accent);color:var(--on,#fff)}
#rs{background:var(--btn);color:var(--text);flex:.5}
button:active{transform:scale(.96)}
.hint{margin:16px 0 0;font-size:.75rem;color:var(--muted);line-height:1.5}
.done .p{stroke:#2fbf71}
</style>
</head>
<body>
<div id="bg"></div>
<main class="app" id="app">
  <header>
    <h1>📚<span class="ht"> Timer Belajar</span></h1>
    <div><button class="theme" id="zoom" aria-label="Perbesar angka"></button><button class="theme" id="fs" aria-label="Layar penuh"></button><button class="theme" id="rot" aria-label="Putar horizontal"></button><button class="theme" id="bgb" aria-label="Pilih background"></button><button class="theme" id="theme" aria-label="Ganti tema"></button></div>
  </header>
  <div class="sw" id="sw"></div>
  <div class="ring">
    <svg viewBox="0 0 200 200"><circle class="t" cx="100" cy="100" r="90"/><circle class="p" id="ring" cx="100" cy="100" r="90"/></svg>
    <div class="time" id="timeBox"><b id="disp">25:00</b><span id="status">Siap belajar</span></div>
  </div>
  <div class="adj">
    <button id="minus" aria-label="Kurangi 1 menit">−</button>
    <div class="m"><span id="mins">25</span> menit</div>
    <button id="plus" aria-label="Tambah 1 menit">+</button>
  </div>
  <div class="presets">
    <button data-m="15">15</button><button data-m="25">25</button><button data-m="45">45</button><button data-m="60">60</button>
  </div>
  <div class="main">
    <button id="go">Mulai</button>
    <button id="rs">Reset</button>
  </div>
  <p class="hint">Tombol <b>Volume +/−</b> = tambah/kurangi 1 menit (jika didukung browser HP). Cadangan: tombol +/− di layar atau panah ↑↓ di keyboard.</p>
<div class="panel" id="panel"></div>
<div class="toast" id="toast"></div>
</main>

  app.classList.toggle('rot',on);

var panel=$('panel');
function setBg(k){
  var bg=$('bg'),h=document.documentElement;
  if(!B[k]){k='none';bg.innerHTML='';bg.style.background='';h.classList.remove('hasbg')}
  else{bg.style.background=B[k][0];bg.innerHTML=B[k][1]();h.classList.add('hasbg')}
  Array.prototype.forEach.call(panel.children,function(b){b.classList.toggle('on',b.dataset.k===k)});
  save('tb-bg',k);
}
SC.forEach(function(x){
  var b=document.createElement('button');
  b.dataset.k=x[0];b.textContent=x[1]+' '+x[2];
  b.onclick=function(){setBg(x[0]);panel.classList.remove('on')};
  panel.appendChild(b);
});
$('bgb').onclick=function(e){e.stopPropagation();panel.classList.toggle('on')};
document.addEventListener('click',function(e){if(panel.classList.contains('on')&&!panel.contains(e.target))panel.classList.remove('on')});
setBg(load('tb-bg'));
window.addEventListener('orientationchange',function(){setTimeout(fitRot,300)});
function toggleZoom(){app.classList.toggle('zoom')}
zb.onclick=toggleZoom;
$('timeBox').onclick=toggleZoom;
var sw=$('sw');
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  themeBtn.innerHTML=t==='dark'?SUN:MOON;
  Array.prototype.forEach.call(sw.children,function(b){b.classList.toggle('on',b.dataset.t===t)});
  save('tb-theme',t);
}
THEMES.forEach(function(x){
  var b=document.createElement('button');
  b.dataset.t=x[0];b.title=x[1];b.setAttribute('aria-label','Tema '+x[1]);
  b.style.background=x[2];
  b.onclick=function(){setTheme(x[0])};
  sw.appendChild(b);
});
var saved=load('tb-theme');
if(THEMES.some(function(x){return x[0]===saved})){setTheme(saved)}else{
  var h=new Date().getHours();
  setTheme(h>=6&&h<18?'light':'dark');
}
themeBtn.onclick=function(){
  setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
};

var m0=parseInt(load('tb-min'),10);
if(m0>=MIN&&m0<=MAX){total=remaining=m0*60}

function fmt(s){
  var m=Math.floor(s/60),x=s%60;
  return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;
}
function render(){
  disp.textContent=fmt(remaining);
  mins.textContent=Math.round(total/60);
  ring.style.strokeDashoffset=C*(1-(total?remaining/total:0));
  document.title=(running?fmt(remaining)+' · ':'')+'Timer Belajar';
}

function adjust(d){
  var newTotal=total+d*60;
  if(newTotal<MIN*60||newTotal>MAX*60)return;
  if(running){
    if(remaining+d*60<=0)return;
    endAt+=d*60000;total=newTotal;remaining+=d*60;
  }else{
    total=remaining=newTotal;
    app.classList.remove('done');
    status.textContent='Siap belajar';
  }
  save('tb-min',Math.round(total/60));
  render();
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
}

var AC=null;
function unlock(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume()}catch(e){}}
function beep(){
  try{
    unlock();var ac=AC;
    [0,.3,.6].forEach(function(t){
      var o=ac.createOscillator(),g=ac.createGain();
      o.frequency.value=880;o.connect(g);g.connect(ac.destination);
      g.gain.setValueAtTime(.2,ac.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.25);
      o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.25);
    });
  }catch(e){}
  if(navigator.vibrate)try{navigator.vibrate([200,100,200,100,400])}catch(e){}
}

function tick(){
  remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));
  render();
  if(remaining<=0)finish();
}
function start(){
  unlock();
  if(remaining<=0)remaining=total;
  endAt=Date.now()+remaining*1000;
  running=true;app.classList.remove('done');
  go.textContent='Jeda';status.textContent='Fokus…';
  clearInterval(timer);timer=setInterval(tick,250);
}
function pause(){
  running=false;clearInterval(timer);
  go.textContent='Lanjut';status.textContent='Dijeda';render();
}
function finish(){
  running=false;clearInterval(timer);
  go.textContent='Mulai';status.textContent='Selesai! Istirahat dulu 🎉';
  app.classList.add('done');beep();render();
}
function reset(){
  running=false;clearInterval(timer);
  remaining=total;app.classList.remove('done');
  go.textContent='Mulai';status.textContent='Siap belajar';render();
}

go.onclick=function(){running?pause():start()};
$('rs').onclick=reset;
$('plus').onclick=function(){adjust(1)};
$('minus').onclick=function(){adjust(-1)};
Array.prototype.forEach.call(document.querySelectorAll('.presets button'),function(b){
  b.onclick=function(){
    if(running)return;
    total=remaining=parseInt(b.dataset.m,10)*60;
    save('tb-min',b.dataset.m);app.classList.remove('done');
    status.textContent='Siap belajar';render();
  };
});

/* Tombol volume HP (jika browser/wrapper meneruskan eventnya) + panah keyboard */
window.addEventListener('keydown',function(e){
  var k=e.key,c=e.code;
  if(k==='AudioVolumeUp'||c==='AudioVolumeUp'||k==='VolumeUp'||e.keyCode===175||k==='ArrowUp'){
    e.preventDefault();adjust(1);
  }else if(k==='AudioVolumeDown'||c==='AudioVolumeDown'||k==='VolumeDown'||e.keyCode===174||k==='ArrowDown'){
    e.preventDefault();adjust(-1);
  }else if(k===' '&&e.target===document.body){
    e.preventDefault();running?pause():start();
  }
},true);

document.addEventListener('visibilitychange',function(){if(running)tick()});
render();
})();
</script>
</body>
</html>
